<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fff'/%3E%3Crect x='3' y='3' width='18' height='18' rx='5' fill='none' stroke='%23000' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='12' r='4' fill='none' stroke='%23000' stroke-width='1.6'/%3E%3C/svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ig:#000; --ig2:#737373; --line:#dbdbdb; --soft:#efefef; --blue:#0095f6; --hover:#f2f2f2;
  --igfont:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ink:#1B1316; --pink:#FF2D6F; --paper:#F6F4EF; --muted:#6B675F; --faint:#A6A29A; --chip:#F1EEE8;
  --lime:#C6F08A; --butter:#FFD86B; --blush:#FFB8CF;
  --ui:Inter,system-ui,-apple-system,sans-serif; --track:-.05em;
  --glass:rgba(255,241,230,.72); --lift:0 10px 30px rgba(27,19,22,.12);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#dee1e6;color:var(--ig);font-family:var(--igfont)}
.browser{display:flex;flex-direction:column;height:100%}
.tabstrip{display:flex;align-items:flex-end;gap:2px;height:42px;padding:8px 12px 0;background:#dee1e6}
.tab{display:flex;align-items:center;gap:8px;height:34px;max-width:220px;padding:0 14px;border:0;border-radius:8px 8px 0 0;background:transparent;color:#3c4043;font-size:13px}
.tab:hover{background:rgba(255,255,255,.5)}
.tab.on{background:#fff;color:#202124}
.tab svg{flex:none}
.toolbar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px 8px;background:#fff;border-bottom:1px solid #dadce0}
.navbtn{width:32px;height:32px;border:0;border-radius:50%;background:none;color:#5f6368;display:grid;place-items:center}
.navbtn:hover:not(:disabled){background:#f1f3f4}
.navbtn:disabled{opacity:.38;cursor:default}
.address{flex:1;display:flex;align-items:center;gap:8px;height:34px;margin:0 8px;padding:0 14px;border-radius:999px;background:#f1f3f4;color:#202124;font-size:14px;min-width:0}
.address span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sites{flex:1;min-height:0;background:#fff}
.pane{height:100%;min-height:0}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr) 319px;height:100%}
.nav{border-right:1px solid var(--line);padding:8px 12px 16px;display:flex;flex-direction:column;min-height:0}
.word{display:block;margin:20px 12px 18px;padding:0;border:0;background:none;font-family:"Grand Hotel",cursive;font-size:34px;line-height:1;letter-spacing:-.03em;text-align:left}
.item{display:flex;align-items:center;gap:16px;width:100%;height:50px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:16px;text-align:left}
.item svg{flex:none}
.item:hover{background:var(--hover)}
.item[aria-current="page"]{font-weight:700}
.item .avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
.item[aria-current="page"] .avatar{box-shadow:0 0 0 2px #000}
.nav .grow{flex:1}
.center{min-width:0;overflow:auto;height:100%}
.col{width:470px;margin:0 auto;padding:16px 0 80px}
.stories{display:flex;gap:18px;overflow:auto;padding:8px 0 18px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{width:78px;border:0;background:none;padding:0;display:grid;justify-items:center;gap:6px}
.ring{width:66px;height:66px;border-radius:50%;padding:2px;background:conic-gradient(from 210deg,#f9ce34,#ee2a7b 45%,#6228d7 80%,#f9ce34)}
.story.seen .ring{background:#dbdbdb}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story span{font-size:12px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post{padding-bottom:16px;margin-bottom:8px;border-bottom:1px solid var(--soft)}
.head{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 4px 10px}
.head .avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.who{flex:1;min-width:0;font-size:14px}
.who strong{font-weight:600}
.dot{color:var(--ig2);padding:0 4px}
.time{color:var(--ig2);font-weight:400}
.more{width:32px;height:32px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.more:hover{background:var(--hover)}
.photo{display:block;width:100%;height:auto;background:#fafafa}
.actions{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.actions button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center}
.actions .push{margin-left:auto}
.actions button[aria-pressed="true"]{color:#ed4956}
.actions button.mark[aria-pressed="true"]{color:#000}
.likes{margin:2px 0 6px;font-size:14px;font-weight:600}
.caption{margin:0 0 6px;font-size:14px;line-height:1.4}
.caption strong{font-weight:600;margin-right:6px}
.comments{display:grid;gap:4px;margin:0 0 6px}
.comments p{margin:0;font-size:14px;line-height:1.4}
.comments strong{font-weight:600;margin-right:6px}
.quiet{border:0;background:none;padding:2px 0;color:var(--ig2);font-size:14px;text-align:left}
.composer{display:flex;gap:10px;align-items:center;padding:8px 0 0}
.composer input{flex:1;border:0;outline:none;font-size:14px;padding:4px 0}
.composer button{border:0;background:none;color:var(--blue);font-weight:600;font-size:14px;padding:0}
.composer button:disabled{opacity:.4}
.menu{position:absolute;z-index:5;background:#fff;border:1px solid var(--soft);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:180px;padding:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;font-size:14px}
.menu button:hover{background:var(--hover)}
.right{padding:30px 24px 0 0}
.me{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.me img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.me div{flex:1;min-width:0}
.me strong{display:block;font-size:14px}
.me span{display:block;color:var(--ig2);font-size:14px}
.linkish{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600;padding:0}
.sug-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;color:var(--ig2);font-size:14px;font-weight:600}
.sug{display:flex;align-items:center;gap:12px;padding:8px 0}
.sug img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.sug div{flex:1;min-width:0}
.sug strong{display:block;font-size:14px}
.sug span{display:block;color:var(--ig2);font-size:12px}
.panel{width:470px;margin:0 auto;padding:28px 0 64px}
.panel h1{font-size:20px;font-weight:600;margin:0 0 16px}
.search{width:100%;border:0;background:#efefef;border-radius:8px;padding:12px 16px;font-size:16px;outline:none;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid button{border:0;padding:0;background:#fafafa;aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.thread,.note-row{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 4px;border-radius:8px}
.thread:hover,.note-row:hover{background:var(--hover)}
.thread img,.note-row img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.thread strong,.note-row strong{display:block;font-size:14px}
.thread span,.note-row span{color:var(--ig2);font-size:14px}
.bubble{background:#efefef;border-radius:18px;padding:10px 14px;margin:8px 0;font-size:14px;max-width:320px}
.bubble.mine{background:#3797f0;color:#fff;margin-left:auto}
.reel{position:relative;background:#000;border-radius:4px;overflow:hidden}
.reel img{width:100%;max-height:72vh;object-fit:contain;display:block;background:#000}
.reel.play img{animation:ken 8s linear infinite alternate}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.06)}}
.play{position:absolute;left:16px;bottom:16px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px}
.empty{color:var(--ig2);font-size:14px}
.morebox{display:grid;gap:8px;max-width:360px}
.morebox button,.morebox a{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;font-size:15px;text-decoration:none;color:#000}
.morebox button:hover,.morebox a:hover{background:var(--hover)}
.morebox p{color:var(--ig2);font-size:14px;line-height:1.45}

#popup{position:fixed;z-index:80;right:16px;bottom:16px;left:auto;width:max-content;max-width:min(340px,calc(100vw - 32px));font-family:var(--ui);letter-spacing:var(--track);color:var(--ink)}
#popup.review{width:min(340px,calc(100vw - 32px))}
#popup .island{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:12px 14px;display:grid;gap:10px;border:0}
#popup .ask,#popup .live{display:flex;align-items:center;gap:10px}
#popup .q{font-size:15px;margin:0;flex:1}
#popup .btn{border:0;border-radius:999px;padding:8px 14px;font:400 14px/1 var(--ui);letter-spacing:var(--track);cursor:pointer;background:transparent;color:var(--ink);box-shadow:none}
#popup .btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 18px rgba(255,45,111,.16)}
#popup .btn.pink:hover{box-shadow:0 6px 22px rgba(255,45,111,.22)}
#popup .btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #E2DEDF}
#popup .btn.ghost{background:transparent;color:var(--muted);padding-inline:6px;box-shadow:none}
#popup .btn.text{background:none;color:var(--faint);padding:0;font-size:12px;justify-self:start;border:0;border-radius:0;box-shadow:none}
#popup .clip-hint{margin:0;font:400 12px/1.35 var(--ui);letter-spacing:var(--track);color:var(--faint)}
#popup .dotp{width:8px;height:8px;border-radius:50%;background:#C6F08A;border:0;flex:none}
#popup .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#popup.review img.crop{width:100%;height:160px;object-fit:cover;border-radius:14px;background:#fff;display:block;border:0}
#popup .from{margin:0;font-size:13px;color:var(--muted)}
#popup .from b{color:var(--ink);font-weight:500}
#popup .tags{display:flex;flex-wrap:wrap;gap:6px}
#popup .tags button{border:0;background:#fff;color:var(--ink);border-radius:999px;padding:6px 10px;font:400 13px/1 var(--ui);letter-spacing:var(--track);box-shadow:inset 0 0 0 1px #E2DEDF}
#popup .tags button[aria-pressed="true"]{background:var(--ink);color:#fff}
#popup label.why{display:grid;gap:6px;font-size:12px;color:var(--faint)}
#popup textarea{border:0;box-shadow:inset 0 0 0 1px #E2DEDF;border-radius:12px;padding:8px 10px;resize:vertical;min-height:64px;font:400 14px/1.4 var(--ui);letter-spacing:var(--track);background:#fff}
#popup .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#popup .hint{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
#popup .warn{margin:0;color:var(--pink);font-size:12px}
#copybox .btn{border:1px solid #000;border-radius:2px;padding:6px 10px;font:400 12px/1 var(--ui);letter-spacing:0;cursor:pointer;background:#fff;color:#000;box-shadow:none}
#copybox .btn:hover{background:#000;color:#fff}
#map .btn,#detail .btn{border:1px solid #fff;border-radius:2px;padding:6px 10px;font:400 12px/1 var(--ui);letter-spacing:0;cursor:pointer;background:transparent;color:#fff;box-shadow:none}
#map .btn:hover,#detail .btn:hover{background:#fff;color:#111}
#map .btn.text,#detail .btn.text{background:transparent;color:#c8c8c8;border:0;border-bottom:1px solid #c8c8c8;border-radius:0;padding:2px 0;font-size:11px}
#map .btn.text:hover,#detail .btn.text:hover{background:transparent;color:#fff}
#veil{display:none !important}
body.picking,body.picking img.photo{cursor:crosshair}
#marquee{position:fixed;z-index:50;border:1px solid #000;box-shadow:0 0 0 9999px rgba(0,0,0,.2);pointer-events:none}
#map{position:fixed;inset:0;z-index:90;overflow:hidden;display:flex;flex-direction:column;background:#111;font-family:var(--ui);font-size:13px;letter-spacing:0;color:#fff}
.mapbar{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#111;border-bottom:1px solid #2a2a2a}
.logo{font-weight:500;font-size:22px;letter-spacing:-.05em;margin-right:8px;font-family:var(--ui);color:#fff}
.mapbar h1{font-size:14px;font-weight:400;margin:0;color:#fff;flex:1;letter-spacing:-.05em}
.map-viewport{flex:1;min-height:0;overflow:auto;background:#111;cursor:grab}
.map-viewport.panning{cursor:grabbing}
.map-canvas{position:relative;min-width:1760px;min-height:1280px;background:#141414}
.slab,.alab{position:absolute;margin:0;color:#fff;font-weight:500;pointer-events:none;white-space:nowrap;font-family:var(--ui)}
.slab{font-size:32px;letter-spacing:-.04em;line-height:1.1}
.alab{font-size:13px;color:#e8e8e8}
#map .hint{margin:0;font-size:12px;color:#c8c8c8;line-height:1.35}
#map .empty-hint{position:absolute;width:220px;white-space:normal;pointer-events:none}
.map-card{position:absolute;width:176px;height:236px;border:0;border-radius:0;background:transparent;padding:0;box-shadow:none;cursor:grab;color:#111;touch-action:none;user-select:none;-webkit-user-select:none;transform:rotate(var(--rot,0deg));transform-origin:50% 60%;z-index:1}
.map-card .face{height:100%;border-radius:12px;background:var(--card,#F7D64A);display:flex;flex-direction:column;overflow:hidden;color:#111}
.map-card:hover,.map-card.dragging{transform:rotate(0deg) translateY(-8px);z-index:6;cursor:grabbing}
.map-card .card-photo{flex:1;width:100%;min-height:0;object-fit:cover;border:0;border-radius:0;display:block;background:rgba(0,0,0,.08);pointer-events:none;-webkit-user-drag:none}
.map-card .card-quote{flex:1;display:block;padding:16px 14px 8px;text-align:left;font:500 17px/1.25 var(--ui);color:#111}
.map-card .card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 10px 10px;border-top:1px solid rgba(0,0,0,.28)}
.map-card .badge{width:26px;height:26px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.map-card .badge svg{display:block}
.map-card .who{min-width:0;text-align:left}
.map-card .who b{display:block;font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-card .who span{display:block;margin-top:1px;font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
#map-links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
#map-links .link-line{fill:none;stroke:rgba(255,255,255,.82);stroke-width:1.5;stroke-linecap:round}
#map-links .link-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:none}
#map[data-tool="remove"] #map-links .link-hit{pointer-events:stroke;cursor:pointer}
.sticky{position:absolute;z-index:2;width:180px;min-height:96px;padding:10px 12px 12px;background:#f4f1ea;color:#111;border:0;border-radius:12px;box-shadow:none;cursor:grab;touch-action:none;font-family:var(--ui)}
.sticky.comment{width:168px;min-height:72px;background:#fff}
.sticky.dragging{cursor:grabbing;z-index:4}
.sticky-label{font-size:11px;font-weight:500;margin-bottom:6px}
.sticky-text{min-height:48px;outline:none;font:400 14px/1.4 var(--ui);cursor:text;user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word}
.sticky-text:empty::before{content:attr(data-ph);opacity:.45}
.sticky.link-from,.sticky.is-selected,.map-card.link-from .face,.map-card.is-selected .face{outline:2px solid #fff;outline-offset:3px}
#map[data-tool="note"] .map-viewport,#map[data-tool="connect"] .map-viewport,#map[data-tool="branch"] .map-viewport,#map[data-tool="comment"] .map-viewport,#map[data-tool="remove"] .map-viewport,
#map[data-tool="note"] .map-card,#map[data-tool="connect"] .map-card,#map[data-tool="branch"] .map-card,#map[data-tool="comment"] .map-card,#map[data-tool="remove"] .map-card,
#map[data-tool="note"] .sticky,#map[data-tool="connect"] .sticky,#map[data-tool="branch"] .sticky,#map[data-tool="comment"] .sticky,#map[data-tool="remove"] .sticky{cursor:crosshair}
#map .tools-wrap{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;max-width:calc(100vw - 24px)}
#map .tool-hint{margin:0;padding:6px 10px;background:#2a2a2a;color:#fff;border:1px solid #3a3a3a;border-radius:2px;box-shadow:none;font:400 12px/1.35 var(--ui);white-space:nowrap}
#map .tools{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:2px;min-width:280px;height:50px;padding:6px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:2px;box-shadow:none}
#map .tools button{display:flex;align-items:center;justify-content:center;gap:6px;flex:none;width:36px;height:36px;border:0;border-radius:2px;background:transparent;color:#fff;padding:0;box-shadow:none;font-family:var(--ui)}
#map .tools button .tl{display:none;font:400 13px/1 var(--ui);letter-spacing:0}
#map .tools button:hover{background:#fff;color:#111}
#map .tools button[aria-pressed="true"]{width:auto;padding:0 12px 0 8px;background:#fff;color:#111}
#map .tools button[aria-pressed="true"] .tl{display:block}
@media (max-width:720px){
  #map .tool-hint{white-space:normal;text-align:center}
  #map .tools{min-width:0;width:100%}
}
.pinterest{height:100%;display:flex;flex-direction:column;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#111}
.pbar{display:flex;align-items:center;gap:8px;height:72px;padding:8px 16px;background:#fff;flex:none}
.plogo{width:48px;height:48px;border:0;border-radius:50%;background:#e60023;color:#fff;font-weight:700;font-size:26px;line-height:1}
.pnav{display:flex;gap:4px}
.pnav button,.picon{border:0;background:none;border-radius:24px;padding:10px 14px;font-weight:700;font-size:16px;color:#111}
.pnav button[aria-current="page"]{background:#111;color:#fff}
.pnav button:hover,.picon:hover{background:#efefef}
.pnav button[aria-current="page"]:hover{background:#111}
.psearch{flex:1;min-width:80px;height:48px;border:0;border-radius:24px;background:#e9e9e9;padding:0 18px;font-size:16px;outline:none}
.picon{width:48px;height:48px;padding:0;display:grid;place-items:center}
.picon img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.pbody{flex:1;min-height:0;overflow:auto}
.masonry{column-count:2;column-gap:16px;padding:8px 16px 96px}
.pin{break-inside:avoid;margin:0 0 16px;position:relative}
.pin .photo{width:100%;height:auto;border-radius:16px;display:block;background:#efefef}
.pin .hover{position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,.45);opacity:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px;pointer-events:none}
.pin:hover .hover,.pin:focus-within .hover{opacity:1}
.pin .hover button{pointer-events:auto}
.psave{border:0;background:#e60023;color:#fff;border-radius:24px;padding:12px 16px;font-weight:700;font-size:16px}
.psave[aria-pressed="true"]{background:#111}
.pboard{border:0;background:rgba(255,255,255,.95);color:#111;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;max-width:58%;text-align:left}
.closeup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:28px;padding:20px 28px 80px;align-items:start}
.closeup .photo{width:100%;border-radius:16px}
.closeup h2{margin:12px 0 6px;font-size:28px;font-weight:600}
.back{border:0;background:none;font-weight:700;font-size:16px;padding:8px 0}
.boards{display:grid;gap:8px;max-width:520px}
.boards button{display:flex;justify-content:space-between;border:0;background:#efefef;border-radius:16px;padding:16px;font-weight:700;font-size:16px}
@media (min-width:900px){.masonry{column-count:3}}
@media (min-width:1100px){.masonry{column-count:4}}
@media (min-width:1400px){.masonry{column-count:5}}
@media (max-width:800px){.closeup{grid-template-columns:1fr}}

      return;
    }
    if (pview === "notes") {
      el.innerHTML = '<div style="padding:24px 28px"><h1>Updates</h1>' + PINS.slice(0, 5).map(function (p) {
        return '<button class="note-row" type="button" data-open-pin="' + esc(p.id) + '"><img src="' + esc(p.image) + '" alt=""><div><strong>' + esc(p.account) + '</strong><span>saved a pin to ' + esc(p.board) + "</span></div></button>";
      }).join("") + "</div>";
      paintChrome();
      return;
    }
    var title = pview === "explore" ? "<h1 style=\"padding:8px 16px 0\">Explore</h1>" : (pview === "board" ? "<h1 style=\"padding:8px 16px 0\">" + esc(state.boardFilter || "") + "</h1>" : "");
    var list = visiblePins();
    el.innerHTML = title + '<div class="masonry">' + (list.length ? list.map(pinCard).join("") : '<p class="empty" style="padding:16px">No pins match that search.</p>') + "</div>";
    paintChrome();
  }
  function snapshot() { return { tab: tab, view: view, pview: pview, pin: openPinId, post: subPostId }; }
  function sameSnap(a, b) { return a && b && a.tab === b.tab && a.view === b.view && a.pview === b.pview && a.pin === b.pin && (a.post || "") === (b.post || ""); }
  function paintChrome() {
    document.querySelectorAll(".tab").forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    var url = "instagram.com";
    if (tab === "pin") url = openPinId ? "pinterest.com/pin/" + openPinId : (pview === "explore" ? "pinterest.com/explore" : pview === "create" ? "pinterest.com/boards" : "pinterest.com");
    else if (tab === "sub") url = subPostId ? "substack.com/p/" + subPostId : "substack.com";
    else if (view && view !== "home") url = "instagram.com/" + view;
    document.getElementById("url").textContent = url;
    document.getElementById("site-ig").hidden = tab !== "ig";
    document.getElementById("site-pin").hidden = tab !== "pin";
    document.getElementById("site-sub").hidden = tab !== "sub";
    document.getElementById("hist-back").disabled = histAt <= 0;
    document.getElementById("hist-forward").disabled = histAt < 0 || histAt >= hist.length - 1;
  }
  function remember() {
    if (applying) return;
    var snap = snapshot();
    if (sameSnap(hist[histAt], snap)) { paintChrome(); return; }
    hist = hist.slice(0, histAt + 1);
    hist.push(snap);
    histAt = hist.length - 1;
    paintChrome();
  }
  function applySnap(snap) {
    applying = true;
    tab = snap.tab;
    view = snap.view;
    pview = snap.pview;
    openPinId = snap.pin;
    subPostId = snap.post || "";
    openThread = null;
    renderNav();
    renderCenter();
    renderPin();
    renderSub();
    paintChrome();
    if (mode === "live") renderPopup();
    else placePopup();
    applying = false;
  }
  function setTab(next) {
    if (tab === next) return;
    tab = next;
    if (tab === "sub") renderSub();
    remember();
    if (mode === "live") renderPopup();
    else placePopup();
  }

  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.onclick = function () { setTab(btn.dataset.tab); };
  });
  document.getElementById("hist-back").onclick = function () {
    if (histAt <= 0) return;
    histAt -= 1;
    applySnap(hist[histAt]);
  };
  document.getElementById("hist-forward").onclick = function () {
    if (histAt >= hist.length - 1) return;
    histAt += 1;
    applySnap(hist[histAt]);
  };
  document.getElementById("hist-reload").onclick = function () {
    if (tab === "ig") { view = "home"; openThread = null; renderNav(); renderCenter(); }
    else if (tab === "sub") { subPostId = ""; renderSub(); }
    else { pview = "home"; openPinId = null; pquery = ""; var box = document.getElementById("psearch"); if (box) box.value = ""; renderPin(); }
    remember();
    toast("Page refreshed");
  };
  document.querySelector(".pnav").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-pview]");
    if (!btn) return;
    pview = btn.dataset.pview;
    openPinId = null;
    renderPin();
    remember();
  });
  document.getElementById("p-logo").onclick = function () { pview = "home"; openPinId = null; renderPin(); remember(); };
  document.getElementById("p-notes").onclick = function () { pview = "notes"; openPinId = null; renderPin(); remember(); };
  document.getElementById("p-messages").onclick = function () { pview = "notes"; openPinId = null; renderPin(); remember(); };
  document.getElementById("p-profile").onclick = function () { pview = "create"; openPinId = null; renderPin(); remember(); };
  document.getElementById("psearch").addEventListener("input", function (e) {
    pquery = e.target.value;
    if (pview === "pin" || pview === "create" || pview === "notes") pview = "home";
    openPinId = null;
    renderPin();
  });
  document.getElementById("pbody").addEventListener("click", function (e) {
    if (skipClick) return;
    var save = e.target.closest("[data-pin-save]");
    if (save) {
      var pin = pinById(save.dataset.pinSave);
      pin.saved = !pin.saved;
      renderPin();
      return;
    }
    var boardBtn = e.target.closest("[data-board-for]");
    if (boardBtn) {
      var names = ["Gold edges", "Printed pages", "Drawn figures", "Small lights", "Line studies", "Blue grounds", "Letters", "Dark studies", "Cloth"];
      var pin2 = pinById(boardBtn.dataset.boardFor);
      pin2.board = names[(names.indexOf(pin2.board) + 1) % names.length];
      renderPin();
      return;
    }
    var openBoard = e.target.closest("[data-open-board]");
    if (openBoard) { state.boardFilter = openBoard.dataset.openBoard; pview = "board"; renderPin(); remember(); return; }
    var jump = e.target.closest("[data-open-pin]");
    if (jump) { openPinId = jump.dataset.openPin; pview = "pin"; renderPin(); remember(); return; }
    if (e.target.id === "pin-back") { openPinId = null; pview = "home"; renderPin(); remember(); return; }
    if (mode === "pick") return;
    var article = e.target.closest("article.pin");
    if (article && e.target.closest("img.photo")) { openPinId = article.id; pview = "pin"; renderPin(); remember(); }
  });

  function subPost(id) { return SUB_POSTS.filter(function (p) { return p.id === id; })[0]; }
  function showSubPost(id) {
    openCard = null;
    renderDetail();
    document.getElementById("map").hidden = true;
    subPostId = id || "";
    tab = "sub";
    renderSub();
    remember();
    placePopup();
  }
  function currentQuote() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return "";
    var node = sel.anchorNode;
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    if (!el || !el.closest || !el.closest("#site-sub")) return "";
    return sel.toString().replace(/\s+/g, " ").trim();
  }
  function postFromSelection() {
    var sel = window.getSelection();
    var node = sel && sel.anchorNode;
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    var marked = el && el.closest && el.closest("[data-post]");
    return subPost(marked ? marked.dataset.post : subPostId);
  }
  function saveSelectedText() {
    var quote = textSel || currentQuote();
    var post = postFromSelection();
    if (!quote || quote.length < 3 || !post || !state.active) return;
    draft = {
      kind: "text",
      site: "Substack",
      handle: post.publication,
      author: post.author,
      board: "",
      postId: post.id,
      quote: quote,
      caption: post.title,
      tag: "",
      note: ""
    };
    mode = "review";
    renderPopup();
  }
  function renderSub() {
    var el = document.getElementById("subbody");
    if (!el) return;
    var post = subPost(subPostId);
    var pub = post ? post.publication : "";
    var initial = pub ? pub.charAt(0) : "S";
    var head = '<header class="top"><button class="mark" type="button" id="sub-home" aria-label="Substack home">' + esc(initial) + '</button><button class="pubname" type="button" id="sub-title">' + esc(pub || "Substack") + '</button><button class="home" type="button" id="sub-feed">Home</button>' +
      (pub ? '<button class="subbtn" type="button" id="sub-follow" aria-pressed="' + (subFollow[pub] ? "true" : "false") + '">' + (subFollow[pub] ? "Subscribed" : "Subscribe") + "</button>" : "") + "</header>";
    if (!post) {
      el.innerHTML = head + '<div class="read feed"><h1>Posts</h1>' + SUB_POSTS.map(function (p) {
        return '<button class="postlink" type="button" data-post="' + esc(p.id) + '"><span class="pub">' + esc(p.publication) + "</span><strong>" + esc(p.title) + '</strong><span class="dek">' + esc(p.dek) + '</span><span class="by">' + esc(p.author) + " · " + esc(p.date) + "</span></button>";
      }).join("") + "</div>";
      return;
    }
    var blocks = post.blocks.map(function (block) {
      if (block.t === "pull") return '<blockquote class="pull">' + esc(block.text) + "</blockquote>";
      if (block.t === "img") return '<figure><img class="photo" src="' + esc(block.src) + '" alt="' + esc(block.cap) + '" draggable="false"><figcaption>' + esc(block.cap) + "</figcaption></figure>";
      return "<p>" + esc(block.text) + "</p>";
    }).join("");
    var comments = post.comments.map(function (c) { return "<p><b>" + esc(c.u) + "</b> " + esc(c.t) + "</p>"; }).join("");
    el.innerHTML = head + '<article class="read" id="' + esc(post.id) + '" data-post="' + esc(post.id) + '" data-site="Substack" data-handle="' + esc(post.publication) + '" data-author="' + esc(post.author) + '" data-caption="' + esc(post.title) + '">' +
      '<p class="pub" style="margin:0;color:#FF6719;font-weight:700;font-size:13px">' + esc(post.publication) + "</p><h1>" + esc(post.title) + '</h1><p class="dek">' + esc(post.dek) + '</p><div class="byline"><span class="avatar" aria-hidden="true">' + esc(post.author.charAt(0)) + "</span><span><b>" + esc(post.author) + "</b><br>" + esc(post.date) + '</span></div><div class="actions"><button type="button" id="sub-like" aria-pressed="' + (post.liked ? "true" : "false") + '">' + (post.liked ? "Liked" : "Like") + " " + post.likes + '</button><button type="button" id="sub-comment">Comment ' + post.comments.length + '</button><button type="button" id="sub-restack" aria-pressed="' + (post.restacked ? "true" : "false") + '">' + (post.restacked ? "Restacked" : "Restack") + '</button></div><div class="body">' + blocks + '</div><div class="comments"><h2>Comments</h2>' + comments + '<form id="sub-form"><textarea name="text" placeholder="Write a comment" aria-label="Write a comment"></textarea><button type="submit">Post comment</button></form></div></article>';
  }
  document.getElementById("site-sub").addEventListener("click", function (e) {
    if (e.target.id === "sub-home" || e.target.id === "sub-title" || e.target.id === "sub-feed") { showSubPost(""); return; }
    var open = e.target.closest("[data-post]");
    if (open && open.classList.contains("postlink")) { showSubPost(open.dataset.post); return; }
    var post = subPost(subPostId);
    if (!post) return;
    if (e.target.id === "sub-follow") { subFollow[post.publication] = !subFollow[post.publication]; renderSub(); return; }
    if (e.target.id === "sub-like") { post.liked = !post.liked; post.likes += post.liked ? 1 : -1; renderSub(); return; }
    if (e.target.id === "sub-restack") { post.restacked = !post.restacked; renderSub(); return; }
    if (e.target.id === "sub-comment") { var area = document.querySelector("#sub-form textarea"); if (area) area.focus(); }
  });
  document.getElementById("site-sub").addEventListener("submit", function (e) {
    if (e.target.id !== "sub-form") return;
    e.preventDefault();
    var post = subPost(subPostId);
    var text = e.target.text.value.trim();
    if (!post || !text) return;
    post.comments.push({ u: "nita.studio", t: text });
    renderSub();
  });
  document.addEventListener("selectionchange", function () {
    if (mode !== "live" || tab !== "sub") {
      if (textSel) { textSel = ""; if (mode === "live") renderPopup(); }
      return;
    }
    var next = currentQuote();
    if (next.length < 3) next = "";
    if (next === textSel) return;
    textSel = next;
    renderPopup();
  });

  renderNav();
  renderRight();
  renderCenter();
  renderPin();
  renderSub();
  renderPopup();
  remember();
})();
</script>
</body>
</html>
